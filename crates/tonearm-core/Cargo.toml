[package]
name = "tonearm-core"
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Platform-independent TIDAL client core of Tonearm (API, models, queue, scrobbling protocol)"
readme = "../../README.md"
keywords = ["tidal", "music"]
categories = ["multimedia::audio"]
publish = false

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
log = "0.4.35"
md-5 = "0.11.0"
rand = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# rustls only (never native-tls). The crypto provider is a feature so an
# iOS build can pick aws-lc-rs (default, needs Xcode clang) or install its own.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "blocking", "form", "charset", "http2", "system-proxy", "rustls-no-provider"] }
urlencoding = "2.1.3"
thiserror = "2"
url = "2"
iroh = { version = "1.4", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"], optional = true }

[features]
default = ["tls-aws-lc"]
# rustls with the aws-lc-rs provider (reqwest's default TLS).
tls-aws-lc = ["reqwest/rustls"]
# Listen Together transport (iroh QUIC, n0 / iroh services relays).
live-net = ["dep:iroh", "dep:tokio"]

[lints]
workspace = true
