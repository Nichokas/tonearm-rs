[package]
name = "tonearm"
version = "1.0.0"
edition = "2024"
description = "An unofficial native GTK4 / Adwaita music streaming client for TIDAL"
license = "GPL-3.0-or-later"
repository = "https://codeberg.org/dergs/Tonearm"
readme = "README.md"
keywords = ["tidal", "music", "gtk", "libadwaita", "gnome"]
categories = ["multimedia::audio", "gui"]
publish = false

[dependencies]
tonearm-core = { path = "crates/tonearm-core", features = ["live-net"] }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8"] }
anyhow = "1.0.104"
async-channel = "2.5.0"
base64 = "0.23.1"
chrono = "0.4.45"
env_logger = "0.11.11"
glib = "0.22"
gst = { version = "0.25.4", package = "gstreamer", features = ["v1_18"] }
gst_audio = { version = "0.25.4", package = "gstreamer-audio" }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_20"] }
libsecret = "0.9.0"
log = "0.4.35"
md-5 = "0.11.0"
qrcode = { version = "0.14.1", default-features = false }
rand = "0.9"
regex = "1"
reqwest = { version = "0.13.5", features = ["json", "blocking", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
urlencoding = "2.1.3"
zbus = "5"

[build-dependencies]
glib-build-tools = "0.22.8"

# Microsoft Pragmatic Rust Guidelines, M-STATIC-VERIFICATION.
[workspace]
members = ["crates/tonearm-core", "crates/tonearm-ffi"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://codeberg.org/dergs/Tonearm"

[lints]
workspace = true

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
# rust-skills anti-unwrap-abuse: no unwrap() outside tests (see clippy.toml).
unwrap_used = "warn"
# rust-skills lint-clippy-nursery-selected / anti-clone-excessive
redundant_clone = "warn"
needless_collect = "warn"
or_fun_call = "warn"
equatable_if_let = "warn"
needless_pass_by_ref_mut = "warn"
useless_let_if_seq = "warn"
branches_sharing_code = "warn"
implicit_clone = "warn"
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"
literal_string_with_formatting_args = "allow"
# Project opt-outs (M-STATIC-VERIFICATION allows case-by-case opt-outs).
# GTK, GStreamer and the TIDAL API speak i32/u32/f64/i64; the values crossing
# these boundaries (pixel sizes, list positions, durations, volumes) are small
# and bounded, and the casts mirror the Go original's int conversions.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
# Duplicate versions come from transitive dependencies we do not control.
multiple_crate_versions = "allow"
# UI builders port Go's declarative widget trees one-to-one; splitting them
# would make them harder to diff against the original.
too_many_lines = "allow"
